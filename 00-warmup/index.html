<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Lab02 - Warmup</title>
    <style>
      /* ADD STYLES HERE */
      .painting {
        width: 500px;
        height: 500px;
        background-color: blue; 
        display: flex;
        flex-direction: row;
      }
      .column0 {
        width: 25%;
        height: 100%;
        background-color: white;
      }
      .column1 {
        width: 75%;
        height: 100%;
        background-color: red;
        display: flex;
        flex-direction: column;
      }
      .c1top {
        height: 75%;
        background-color: red;
      }
      .c1bottom {
        height: 25%;
        background-color: white;
        display: flex;
        flex-direction: row;
      }
      .c0top {
        height: 75%;
      }
      .c0bottom {
        height: 25%;
        background-color: blue;
      }
      .bottomc2 {
        width: 80%;
        background-color: white;
      }
      .bottomc3 {
        width: 20%;
        background-color: yellow;
        display: flex;
        flex-direction: column;
      }
      .bottomc3top {
        height: 50%;
        background-color: white;
      }
      .bottomc3bottom {
        height: 50%;
        background-color: yellow;
      }
      .border {
        width: 100%;
        height: 10px;
        background-color: black;
      }
    </style>
  </head>
  <body>
    <!-- ADD STRUCTURE HERE -->
     <main class="painting">
      <section class="column0">
        <section class="c0top">
          <div class="border"></div>
        </section>
        <section class="c0bottom"></section>
      </section>
      <section class="column1">
        <section class="c1top"></section>
        <section class="c1bottom">
          <section class="bottomc2"></section>
          <section class="bottomc3">
            <section class="bottomc3top"></section>
            <section class="bottomc3bottom"></section>
          </section>
        </section>
      </section>
     </main>
  </body>
</html>
